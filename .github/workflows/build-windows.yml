name: Build Windows, macOS and Linux executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-linux:
    name: Linux SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies without desktop native builds
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test remote files and recovery state
        run: python3 -m unittest discover -s tests -p 'remote_worker_test.py' -v
      - name: Test real SSH and Linux PTY integration
        run: |
          node scripts/build-ssh-askpass.cjs
          node --test tests/ssh-config.test.cjs tests/ssh-connection.test.cjs tests/session-restore.test.cjs
  windows:
    name: Windows x64 build and desktop tests
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      binary: ${{ steps.version.outputs.binary }}
      installer: ${{ steps.version.outputs.installer }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Two-core runners start six PowerShell sessions at once; a first command can take over 20 s.
      PROJECT_GRID_TEST_TIMEOUT_SCALE: '3'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The version tag must match package.json.'
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "binary=Project-Grid-$version-win-x64.exe" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "installer=Project-Grid-Setup-$version-x64.exe" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Codex CLI for offline startup checks
        run: npm install --global @openai/codex@0.154.0 --no-audit --no-fund

      - name: Run unit and integration tests
        run: npm test

      - name: Build Windows installer and portable executable
        run: npm run dist

      - name: Verify installer and automatic update metadata
        run: node scripts/verify-update-artifacts.cjs

      - name: Verify desktop with actual terminal button clicks
        run: node scripts/retry.mjs npm run test:desktop -- --packaged

      - name: Verify local terminal restarts refresh Windows PATH without restarting the app
        run: node scripts/retry.mjs npm run test:path-refresh -- --packaged

      - name: Verify session recovery, clipboard and SSH desktop interaction
        run: node scripts/retry.mjs npm run test:sessions -- --packaged

      - name: Verify animated project expansion and return
        run: |
          node scripts/verify-installer-payload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Get-Content -LiteralPath .test-output/installer-payload.json -Raw -Encoding UTF8 | ConvertFrom-Json
          node scripts/retry.mjs node scripts/focus-motion-smoke.mjs --executable $installed.executable

      - name: Verify completion notifications only rearm after new input
        run: node scripts/retry.mjs npm run test:completion -- --packaged

      - name: Test GPU terminal renderer
        run: node scripts/retry.mjs npm run test:gpu-terminal -- --packaged

      - name: Verify file operations and microphone UI with isolated test devices
        run: node scripts/retry.mjs npm run test:workspace -- --packaged --slow-copy

      - name: Verify editing, path copying and independent split terminals
        run: node scripts/retry.mjs npm run test:editor-terminals -- --packaged

      - name: Verify persistent themes, automatic editing and Markdown previews
        run: node scripts/retry.mjs npm run test:themes-markdown -- --packaged

      - name: Verify synchronized lights, readable themes and quiet completed cards
        run: node scripts/retry.mjs npm run test:visual -- --packaged

      - name: Verify internal navigation and removed external editor and manual completion actions
        run: node scripts/retry.mjs npm run test:navigation -- --packaged

      - name: Verify Git status, history and explorer switching for local and SSH projects
        run: node scripts/retry.mjs npm run test:git -- --packaged

      - name: Verify Command Prompt terminals report prompts, run agents and resume sessions
        run: node scripts/retry.mjs npm run test:cmd -- --packaged

      - name: Verify image paths use text-only clipboard data and latest-copy ordering
        run: node scripts/retry.mjs npm run test:clipboard -- --packaged

      - name: Verify liquid glass under terminal load and reduced transparency
        run: node scripts/retry.mjs npm run test:material -- --packaged

      - name: Verify transparent real Codex input and bright text without model requests
        run: node scripts/retry.mjs npm run test:composer -- --packaged

      - name: Create checksum and build notes
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $portable = "Project-Grid-$version-win-x64.exe"
          $installer = "Project-Grid-Setup-$version-x64.exe"
          $files = @($portable, $installer, "$installer.blockmap", 'latest.yml')
          $checksums = foreach ($name in $files) {
            $file = Join-Path release $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $name" }
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $name"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          @(
            'Project Grid — Windows x64 installer and portable build'
            "Commit: $env:GITHUB_SHA"
            "Installer with automatic updates: $installer"
            "Portable edition: $portable"
            'Install the Setup executable to enable background update checks and downloads.'
            'Codex CLI must be installed separately on the target computer.'
          ) | Set-Content -LiteralPath release/BUILD-INFO.txt -Encoding utf8
          @(
            '## Windows build is ready'
            "- Installer: **$installer**"
            "- Portable: **$portable**"
            "- Commit: $env:GITHUB_SHA"
            '- Unit tests and packaged desktop tests passed, including actual Start terminal clicks.'
            '- Download **Project-Grid-windows-x64** from the Artifacts section of this run.'
            '- SHA-256 checksums and the automatic update feed are included.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload verified executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Project-Grid-windows-x64
          path: |
            release/Project-Grid-*.exe
            release/Project-Grid-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-screenshots
          path: |
            .test-output/desktop-*/*.png
            .test-output/sessions-*/*.png
            .test-output/workspace-*/*.png
            .test-output/focus-motion-*/*.png
            .test-output/editor-terminals-*/*.png
            .test-output/themes-markdown-*/*.png
            .test-output/themes-markdown-*/wallpapers.json
            .test-output/visual-*/*.png
            .test-output/visual-*/results.json
            .test-output/navigation-*/*.png
            .test-output/clipboard-*/*.png
            .test-output/material-*/*.png
            .test-output/material-*/results.json
            .test-output/composer-*/*.png
            .test-output/composer-*/results.json
            .test-output/path-refresh-*/*.png
            .test-output/path-refresh-*/results.json
            .test-output/git-*/*.png
            .test-output/git-*/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS Apple silicon build and desktop test
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.version.outputs.archive }}
      image: ${{ steps.version.outputs.image }}
    env:
      CI: 'true'
      # Signed ad hoc (package.json build.mac.identity "-"); no Developer ID is looked up.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version.'; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then echo 'The version tag must match package.json.'; exit 1; fi
          echo "archive=Project-Grid-$version-mac-arm64.zip" >> "$GITHUB_OUTPUT"
          echo "image=Project-Grid-$version-mac-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and integration tests, including a real zsh terminal
        run: npm test

      - name: Build the macOS app, DMG and zip
        run: npm run dist:mac

      - name: Verify the app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/Project Grid.app"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          test -x "$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          test -f "$app/Contents/Resources/app.asar.unpacked/node_modules/sherpa-onnx-darwin-arm64/sherpa-onnx.node"
          test -f "$app/Contents/Resources/integration/zsh-integration.zsh"
          test -f "$app/Contents/Resources/integration/agent-event.cjs"
          test -x "$app/Contents/Resources/integration/ssh-askpass.sh"
          if ls "$app/Contents/Resources/integration" | grep -Ei '\.(ps1|cmd|exe|cs)$'; then echo 'Windows integration files are in the macOS app.'; exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          hdiutil verify "release/${{ steps.version.outputs.image }}"

      - name: Verify the packaged app runs a zsh terminal and follows Codex
        run: node scripts/retry.mjs node scripts/mac-smoke.mjs --packaged

      - name: Install the built archive with the one-line installer
        shell: bash
        run: |
          PROJECT_GRID_INSTALL_DIR="$RUNNER_TEMP/Applications" PROJECT_GRID_OPEN=0 bash scripts/install-macos.sh "release/${{ steps.version.outputs.archive }}"
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/Project Grid.app"

      - name: Create checksums and build notes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 "${{ steps.version.outputs.archive }}" "${{ steps.version.outputs.image }}" > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt
          {
            echo '## macOS build is ready'
            echo "- DMG: **${{ steps.version.outputs.image }}**"
            echo "- Zip for the install command: **${{ steps.version.outputs.archive }}**"
            echo "- Commit: $GITHUB_SHA"
            echo '- Unit tests, a real zsh terminal test and the packaged desktop test passed.'
            echo '- Download **Project-Grid-macos-arm64** from the Artifacts section of this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Project-Grid-macos-arm64
          path: |
            release/Project-Grid-*-mac-arm64.dmg
            release/Project-Grid-*-mac-arm64.zip
            release/SHA256SUMS-mac.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-desktop-test-screenshots
          path: .test-output/mac-*/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux ${{ matrix.arch }} build and desktop tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI: 'true'
      PROJECT_GRID_TEST_TIMEOUT_SCALE: '2'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version.'; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then echo 'The version tag must match package.json.'; exit 1; fi
          image_arch=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          echo "image=Project-Grid-$version-linux-$image_arch.AppImage" >> "$GITHUB_OUTPUT"
          echo "archive=Project-Grid-$version-linux-${{ matrix.arch }}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "unpacked=release/${{ matrix.arch == 'x64' && 'linux-unpacked' || 'linux-arm64-unpacked' }}" >> "$GITHUB_OUTPUT"

      - name: Install zsh, a virtual display and FUSE for the AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh xvfb xauth fuse3

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and integration tests, including real Bash and zsh terminals
        run: npm test

      - name: Build the AppImage and tar.gz
        run: npm run dist:linux

      - name: Verify the package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ steps.version.outputs.unpacked }}"
          test -x "$app/project-grid"
          test -f "release/${{ steps.version.outputs.image }}"
          test -f "release/${{ steps.version.outputs.archive }}"
          test -f "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds/linux-${{ matrix.arch }}/pty.node"
          test -f "$app/resources/app.asar.unpacked/node_modules/sherpa-onnx-linux-${{ matrix.arch }}/sherpa-onnx.node"
          for name in bash-integration.bash zsh-integration.zsh agent-event.cjs; do test -f "$app/resources/integration/$name"; done
          test -x "$app/resources/integration/ssh-askpass.sh"
          if ls "$app/resources/integration" | grep -Ei '\.(ps1|cmd|exe|cs)$'; then echo 'Windows integration files are in the Linux app.'; exit 1; fi
          if ls "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds" | grep -E '^(win32|darwin)-'; then echo 'Other platforms PTY binaries are in the Linux app.'; exit 1; fi
          top=$(npx --no-install asar list "$app/resources/app.asar" | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "app.asar: $top"
          [[ $top == 'assets dist electron node_modules package.json ' ]] || { echo 'Unexpected files in app.asar.'; exit 1; }

      - name: Verify the packaged app runs a Bash terminal and follows Codex
        run: xvfb-run -a node scripts/retry.mjs node scripts/linux-smoke.mjs --packaged

      - name: Verify the packaged app runs a zsh terminal and follows Codex
        run: xvfb-run -a node scripts/retry.mjs node scripts/linux-smoke.mjs --packaged --shell zsh

      - name: Verify the AppImage starts and keeps its environment out of terminals
        run: xvfb-run -a node scripts/retry.mjs node scripts/appimage-smoke.mjs "release/${{ steps.version.outputs.image }}"

      - name: Create checksums and build notes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum "${{ steps.version.outputs.image }}" "${{ steps.version.outputs.archive }}" > "SHA256SUMS-linux-${{ matrix.arch }}.txt"
          cat "SHA256SUMS-linux-${{ matrix.arch }}.txt"
          {
            echo "## Linux ${{ matrix.arch }} build is ready"
            echo "- AppImage: **${{ steps.version.outputs.image }}**"
            echo "- Archive: **${{ steps.version.outputs.archive }}**"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Project-Grid-linux-${{ matrix.arch }}
          path: |
            release/${{ steps.version.outputs.image }}
            release/${{ steps.version.outputs.archive }}
            release/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}-desktop-test-screenshots
          path: .test-output/linux-*/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, remote-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tested Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Project-Grid-windows-x64
          path: release-assets

      - name: Download the tested macOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Project-Grid-macos-arm64
          path: release-assets

      - name: Download the tested Linux builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Project-Grid-linux-*
          merge-multiple: true
          path: release-assets

      - name: Verify and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_BINARY: ${{ needs.windows.outputs.binary }}
          RELEASE_INSTALLER: ${{ needs.windows.outputs.installer }}
          MAC_ARCHIVE: ${{ needs.macos.outputs.archive }}
          MAC_IMAGE: ${{ needs.macos.outputs.image }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          cd release-assets
          test -f "$RELEASE_BINARY"
          test -f "$RELEASE_INSTALLER"
          test -f latest.yml
          test -f "$MAC_ARCHIVE"
          test -f "$MAC_IMAGE"
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-mac.txt
          linux=("Project-Grid-$RELEASE_VERSION-linux-x86_64.AppImage" "Project-Grid-$RELEASE_VERSION-linux-x64.tar.gz" "Project-Grid-$RELEASE_VERSION-linux-arm64.AppImage" "Project-Grid-$RELEASE_VERSION-linux-arm64.tar.gz")
          for file in "${linux[@]}"; do test -f "$file"; done
          sha256sum --check SHA256SUMS-linux-x64.txt SHA256SUMS-linux-arm64.txt
          assets=("$RELEASE_BINARY" "$RELEASE_INSTALLER" "$RELEASE_INSTALLER.blockmap" latest.yml SHA256SUMS.txt BUILD-INFO.txt "$MAC_IMAGE" "$MAC_ARCHIVE" SHA256SUMS-mac.txt "${linux[@]}" SHA256SUMS-linux-x64.txt SHA256SUMS-linux-arm64.txt)

          cat > release-notes.md <<EOF
          Windows x64 installer and portable editions of Project Grid, a macOS edition for Apple silicon, and Linux editions for x64 and arm64.

          **Windows — recommended:** install **$RELEASE_INSTALLER** to enable automatic update checks and background downloads.
          For a portable copy, download **$RELEASE_BINARY**.

          **macOS (Apple silicon, macOS 12 or later):** install or update with one command; the app opens directly, without the "cannot verify the developer" prompt:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/noeigenstate/project-grid/main/scripts/install-macos.sh | bash
          \`\`\`

          Or download **$MAC_IMAGE** and drag Project Grid to Applications. The app is signed ad hoc, not notarized by Apple: on first open, allow it once in System Settings › Privacy & Security (Open Anyway), or run \`xattr -dr com.apple.quarantine "/Applications/Project Grid.app"\`. The macOS edition does not update itself; run the command again to update.

          **Linux (x64 and arm64):** download the AppImage for your processor (**Project-Grid-$RELEASE_VERSION-linux-x86_64.AppImage** or **Project-Grid-$RELEASE_VERSION-linux-arm64.AppImage**), make it executable with \`chmod +x\` and run it. The **.tar.gz** archives hold the same app: unpack and run \`./project-grid\` (on Ubuntu 23.10 or later, add \`--no-sandbox\`; the AppImage does that by itself when needed). Local terminals run Bash or zsh, chosen in Settings. The Linux edition does not update itself; download the new version to update.

          Install Codex CLI on the computer or Linux SSH host where your project runs.

          - New: Project Grid for Linux, x64 and arm64. Local terminals run Bash or zsh (chosen in Settings, the login shell's by default) with your own ~/.bashrc or zsh start-up files untouched; codex and claude report each turn, light the card when it finishes and resume after a restart, as on Windows and macOS. Files copy and paste to and from the system file manager. SSH projects work the same.
          - New: Project Grid for macOS. Local terminals run zsh with your own start-up files (~/.zprofile, ~/.zshrc and the rest, untouched); codex and claude report each turn, light the card when it finishes and resume after a restart, as on Windows. SSH projects work the same. ⌘C, ⌘V and ⌘A copy, paste and select in terminals, Control+C interrupts, ⌘-click opens links, ⌘Q asks before closing running terminals. Microphone dictation asks for permission once.
          - The editor marks Git changes that are not staged yet, and a merge conflict keeps the current side, the incoming side or both in one click.
          - Codex and Claude Code conversations open in the reading view by default and read like a document; images pasted into the message box go to the agent.
          - Multiple project terminals with completion alerts.
          - Choose PowerShell or Command Prompt (cmd) for local terminals in Settings. Command Prompt keeps the same integration: prompt and directory tracking, codex and claude status, Claude hooks, spoken notices and session restore with continue.
          - A short usage guide opens on first use and after every update (on what is new): the three steps of a round, the main features and the shortcuts in use. Reopen it any time from Settings.
          - Restarting restores Claude Code as well as Codex: each terminal resumes its own Claude session, and an unfinished turn is told to continue ("继续"). The Launch Codex buttons are gone; type codex or claude at the prompt.
          - Finished rounds breathe slowly from the card edge into the terminal three times, then keep a soft glow until you look; working cards stay steady instead of flashing. Sending a new prompt counts as looking, and the rounds-unviewed counter is gone.
          - The file editor opens ready to edit with line numbers and the caret line highlighted; Ctrl+S saves. Recently opened local projects can be added back in one click from the add dialog.
          - Dropping a dragged card no longer jumps back to its old place for a frame, and split terminals no longer draw a second frame along the rounded card edge.
          - Claude Code is recognised like Codex: type \`claude\` in a project terminal and each turn shows as working, then lights the card when it finishes. Status comes from Claude Code hooks passed at launch, without editing your Claude settings; your own hooks still run. Local projects only for now.
          - Breathing lights work when Windows "Animation effects" is off. All motion follows the new "界面动画" setting (on by default, follow system, or off).
          - Collapsing the sidebar or resizing the window while Codex, Claude Code or another full-screen program runs no longer leaves stray characters after it exits: the terminal and ConPTY reflow once, at the settled size.
          - Smaller download: only Chinese and English Electron language packs are bundled, wallpapers are 2560 px, and the installer uses maximum compression.
          - Voice input uses SenseVoice Small offline: accurate Mandarin, English and Cantonese in simplified Chinese with punctuation. The 239 MB model downloads in the background after the first launch, from Hugging Face or the hf-mirror.com fallback, with resume and SHA-256 checks.
          - Press Ctrl+T to talk to the current terminal: a microphone appears in the middle of its project card, Enter inserts the recognised text and sends it, and Esc cancels. Ctrl+T works in the overview and in an expanded project; the terminal with keyboard focus, or the one last used, receives the text.
          - Click the microphone once to talk and again to insert the text into that terminal's input without sending it, or press Enter to send it; Esc cancels, even while the microphone is still opening. The microphone is blue when a device is connected and red when none is.
          - English interface: Settings → Language switches between Chinese and English, and notifications, dialogs, the tray menu and spoken notices follow.
          - Spoken completion notices: when a turn finishes, a local natural voice says which project finished what, summarised from the instruction you sent to Codex or Claude Code. A more natural offline voice (about 74 MB) can be downloaded in Settings; nothing is uploaded.
          - Keyboard shortcuts are yours to change in Settings → Keyboard Shortcuts, with conflict checks and Restore defaults. New defaults: Ctrl+Tab / Ctrl+Shift+Tab switch to the next / previous project (in the overview they only move typing focus, without expanding), Ctrl+Shift+Enter expands or restores the current project, Ctrl+Shift+F searches, Ctrl+Shift+N adds a project, Ctrl+Shift+T opens a new split terminal and Ctrl+, opens Settings. The title bar keeps only the settings button. Ctrl+A and Ctrl+F stay with the terminal.
          - Sending the next instruction in a terminal counts as viewing its finished turn.
          - The editor shows line numbers and highlights the current line; segmented large files number each segment from 1.
          - Finer finish: a slimmer title bar; the settings scrollbar stays inside its rounded corners; the sidebar draws indent guides, turns folder chevrons and slides its Files | Git switch; the focused editor drops its hard outline for a soft accent; switches, theme cards, menus and buttons respond with gentle motion.
          - Card corners are round all the way down: the terminal area, or an error line, no longer shows square corners past the rounded glass edge and status ring.
          - Calm seams between panes: the gaps show a softened wallpaper, idle panes have no outline or silver ring, and only a soft highlight marks the top edge. Status colours still ring working, waiting and finished panes.
          - Cleaner Apple-style glass: the backdrop is softly blurred and more saturated, and cards, the sidebar and file preview get a gradient edge light, bright at the upper left and faint at the lower right, instead of a uniform outline. Panel headers and footers no longer add their own dark bands.
          - Panel spacing is uniform: the same 6px gap sits between cards, beside the sidebar and against the top and bottom bars, in both the overview and the expanded project view.
          - A redesigned project sidebar: the project name and path as its title, a Files | Git switch with a change count, a lighter file tree with single-colour icons, and a compact icon rail when collapsed. Browse staged, working-tree and conflict changes and committed history with merge graphs, for local and SSH projects.
          - New and restarted local terminals pick up newly installed tools from Windows PATH without restarting Project Grid. Existing injected toolchain paths keep their priority; other terminals remain untouched.
          - Clear liquid-glass title/status bars, sidebar and terminal shells reveal the background with thin optical rims and real SVG backdrop refraction. Text and ANSI colors remain separate from the lens.
          - All themes include an opaque Reduced Transparency fallback. Packaged tests compare refraction pixels and exercise 6/16 cards with six streaming terminals.
          - All VS Code launch actions and manual project-completion controls have been removed. SSH folder menus, terminal directory links and Markdown directory links open the built-in explorer and respect unsaved edits.
          - Previously manually finished projects remain stopped after upgrading, including every split terminal; start them manually when needed. Session identity and history are retained.
          - Image path copying waits for the native clipboard to finish and produces text only. A slower earlier file copy cannot overwrite a newer copied path.
          - While a turn is working its border and status dot stay steadily lit, without flashing. Completion breathes slowly three times from the card edge, then leaves a soft glow until viewed; viewed automatic round completion stays steady green.
          - Brighter, bolder interface and terminal text, readable faint ANSI output and selected inverse text across all three transparent themes. Custom terminal font sizes and color hues are preserved.
          - Codex's dark input and matching history surfaces are transparent, with fully bright faint text. Each split keeps its own styling; ordinary shells, colored diff backgrounds, selection and block cursors remain distinct. Verified in a real offline Codex TUI with Chinese multiline input, copy/paste and preserved drafts.
          - More room for terminals: the card footer is gone (microphone, Codex and restart controls sit in the card title), and the bottom status bar is merged into the title bar. The search box appears when you press Ctrl+Shift+F. Panes are separated by one uniform 6px gap with 14px corners.
          - Smaller Windows x64 packages exclude source maps, native build sources, duplicate/other-platform PTY binaries and Python caches; required local/SSH runtimes are verified before release.
          - Choose Forest Light, Mountain Blue or Wild Red in Settings; themes apply immediately and persist without restarting terminals.
          - High Sierra, Big Sur coast and Sierra landscape wallpapers are bundled offline at 2560-pixel width; the background is softened, so larger images added size without visible detail.
          - Text/code files open directly in edit mode. Markdown previews render headings, tables, code, task lists, local/SSH images and links, including unsaved drafts.
          - Add independent terminals inside each project with automatic split layout, separate Codex identities and individual session recovery.
          - Edit text and HTML source, save with Ctrl+S, preserve encoding and untouched large-file segments, and detect external modification conflicts.
          - Explorer menus copy local or SSH absolute paths and project-relative paths; Ctrl+Shift+C copies absolute paths.
          - Parent-session lifecycle records determine running, completed and interrupted states; child-agent and stale-turn notifications cannot finish the current task.
          - Incremental bounded status reads, single-flight directory refresh, fewer workspace broadcasts, and removed obsolete sidebar/drag-preview styles.
          - Fullscreen project view, collapsible file explorer, and clear liquid-glass interface.
          - Click the top header or expand button to zoom in gradually; terminal input, output and footer clicks stay in the small card.
          - Smooth zoom is enabled by default even when Windows reduces system animations; Settings offers Smooth, Follow system and Off. Installer tests use the real OS preference.
          - Installed, development and test builds use separate Windows identities; branded multi-size icons and repaired Start menu shortcuts prevent Electron entries from replacing Project Grid in Windows search.
          - Refresh Project Grid's stale Windows Search icon cache so Win+Q recent apps uses the branded icon too.
          - Compact top titlebar, brighter text and Ctrl-click terminal links.
          - Inline image and video viewing, large text pages and isolated HTML previews.
          - The installed edition downloads updates in the background. Restart and install from Settings when your tasks are finished.
          - Add local folders or Linux SSH projects using your existing VS Code SSH configuration.
          - Restore the latest Codex conversation on startup and continue interrupted turns automatically.
          - Select and copy terminal text, copy all scrollback from the context menu, and paste with Ctrl+V.
          - Shift+Enter inserts a newline without submitting; regular Enter stays distinct in local and SSH terminals.
          - Drag the full live project card while neighboring cards shift into place; the saved order survives restarts.
          - Ctrl-click Codex relative file paths, including parenthesized report links, to open them from the project root.
          - Softer glass surfaces, luminous edges, rounded controls and readable terminal content, inspired by Liquid Glass.
          - Compact file explorer with native Windows file copy/paste, creation, renaming and deletion; SSH transfers are supported.
          - Completion alerts are rearmed only by a submitted instruction. Background callbacks with new IDs, focus changes and reopening completed history stay quiet; the one-alert state survives restarts.
          - Status dots show blue activity, pink attention and steady green completion; decorative light stays outside the terminal content.
          - Verified with packaged desktop tests, session restart checks, and real Linux SSH/PTY integration.

          Commit: $GITHUB_SHA
          Build: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          SHA-256 checksums are attached in **SHA256SUMS.txt**.
          EOF

          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi

          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets > existing-release.json 2>/dev/null; then
            # A rerun may finish its own draft, but must never replace a published binary.
            jq -e --arg commit "$GITHUB_SHA" '.targetCommitish == $commit' existing-release.json
            if [[ "$(jq -r '.isDraft' existing-release.json)" == 'false' ]]; then
              jq -e --arg binary "$RELEASE_BINARY" --arg installer "$RELEASE_INSTALLER" 'any(.assets[]; .name == $binary) and any(.assets[]; .name == $installer) and any(.assets[]; .name == "latest.yml")' existing-release.json
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "Project Grid $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --target "$GITHUB_SHA" --title "Project Grid $RELEASE_TAG" \
              --notes-file release-notes.md "${flags[@]}"
          fi

          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
